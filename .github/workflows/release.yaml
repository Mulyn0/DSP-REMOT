name: Build & Release APK

on:
  push:
    tags:
      - 'v*'          # contoh: git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:   # bisa juga dijalankan manual dari tab Actions

permissions:
  contents: write      # wajib agar bisa membuat Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Jika repo hanya berisi lib/ + pubspec.yaml, buat folder android otomatis
      - name: Generate android folder if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name dsp_control .
          fi

      # Build release butuh izin INTERNET (UDP ke DSP), default template hanya ada di debug
      - name: Ensure INTERNET permission
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$M"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          fi

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VER="${GITHUB_REF_NAME:-dev}"
          cp build/app/outputs/flutter-apk/app-release.apk "dsp-phaselab-${VER}.apk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dsp-phaselab-*.apk
          generate_release_notes: true

      # Untuk run manual (tanpa tag), APK tersedia sebagai artifact
      - uses: actions/upload-artifact@v4
        with:
          name: dsp-phaselab-apk
          path: dsp-phaselab-*.apk
