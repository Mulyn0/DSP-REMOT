
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Buat proyek Flutter dan salin kode
        run: |
          flutter create --platforms=android --project-name dsp_remote --org com.geniusnet app
          cp -r kode/lib/. app/lib/
          rm -f app/test/widget_test.dart
          (cd app && flutter pub add shared_preferences)
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' app/android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: dsp-remote-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
